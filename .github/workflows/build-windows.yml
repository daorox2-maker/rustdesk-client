name: Build CortenDesk Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build CortenDesk Windows x64
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:

      - name: Download RustDesk source
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: master
          submodules: recursive
          path: rustdesk

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Flutter Windows
        working-directory: rustdesk
        run: |
          flutter config --enable-windows-desktop
          flutter --version
          flutter doctor -v

      - name: Install LLVM
        run: |
          choco install -y llvm
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install vcpkg dependencies
        working-directory: rustdesk
        run: |
          Write-Host "Baixando vcpkg..."

          git clone --branch 2023.04.15 --depth 1 https://github.com/microsoft/vcpkg "$env:USERPROFILE\vcpkg"

          Write-Host "Inicializando vcpkg..."

          & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Falha ao inicializar o vcpkg."
            exit 1
          }

          echo "VCPKG_ROOT=$env:USERPROFILE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Instalando dependências do RustDesk..."

          & "$env:USERPROFILE\vcpkg\vcpkg.exe" --disable-metrics install `
            "libvpx:x64-windows-static" `
            "libyuv:x64-windows-static" `
            "opus:x64-windows-static" `
            "aom:x64-windows-static"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Falha ao instalar as dependências do vcpkg."
            exit 1
          }

          Write-Host "Dependências vcpkg instaladas com sucesso."

      - name: Configure CortenDesk server
        working-directory: rustdesk
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          Write-Host "Configurando servidor CortenDesk..."
          Write-Host "Servidor: $env:RENDEZVOUS_SERVER"
          Write-Host "Chave: configurada"

          $configFiles = Get-ChildItem `
            -Recurse `
            -File `
            -Path "libs" `
            -Filter "config.rs"

          if ($configFiles.Count -eq 0) {
            Write-Error "Não encontrei config.rs"
            exit 1
          }

          foreach ($file in $configFiles) {
            Write-Host "Configurando: $($file.FullName)"

            $content = Get-Content $file.FullName -Raw

            $content = $content -replace `
              '(?m)^(\s*pub\s+const\s+DEFAULT_RENDEZVOUS_SERVER\s*:\s*&str\s*=\s*)"[^"]*"', `
              '$1"' + $env:RENDEZVOUS_SERVER + '"'

            $content = $content -replace `
              '(?m)^(\s*pub\s+const\s+DEFAULT_RS_PUB_KEY\s*:\s*&str\s*=\s*)"[^"]*"', `
              '$1"' + $env:RS_PUB_KEY + '"'

            Set-Content `
              -Path $file.FullName `
              -Value $content `
              -Encoding UTF8
          }

          Write-Host "Configuração CortenDesk concluída."

      - name: Download Sciter
        working-directory: rustdesk
        run: |
          Write-Host "Criando diretório do Sciter..."

          New-Item `
            -ItemType Directory `
            -Force `
            -Path target\release | Out-Null

          Write-Host "Baixando Sciter..."

          Invoke-WebRequest `
            -UseBasicParsing `
            -Uri "https://raw.githubusercontent.com/c-smile/sciter-sdk/master/bin.win/x64/sciter.dll" `
            -OutFile "target\release\sciter.dll"

          if (-not (Test-Path "target\release\sciter.dll")) {
            Write-Error "sciter.dll não foi baixado."
            exit 1
          }

          Write-Host "Sciter baixado com sucesso."

      - name: Build RustDesk
        working-directory: rustdesk
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: |
          Write-Host "Iniciando compilação do RustDesk..."

          cargo build `
            --release `
            --target x86_64-pc-windows-msvc

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Falha na compilação do RustDesk."
            exit 1
          }

          Write-Host "RustDesk compilado com sucesso."

      - name: Prepare CortenDesk executable
        working-directory: rustdesk
        run: |

          $exe = "target\x86_64-pc-windows-msvc\release\rustdesk.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "rustdesk.exe não foi gerado."
            exit 1
          }

          Write-Host "Executável RustDesk encontrado."

          Copy-Item `
            $exe `
            "..\CortenDesk.exe" `
            -Force

          Copy-Item `
            "target\release\sciter.dll" `
            "..\sciter.dll" `
            -Force

          Write-Host "Executável CortenDesk preparado."

          Get-Item "..\CortenDesk.exe" |
            Select-Object Name,Length

          Get-Item "..\sciter.dll" |
            Select-Object Name,Length

      - name: Upload CortenDesk
        uses: actions/upload-artifact@v4
        with:
          name: CortenDesk-Windows-x64
          path: |
            CortenDesk.exe
            sciter.dll
          if-no-files-found: error
